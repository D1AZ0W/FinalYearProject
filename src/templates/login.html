<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | HelmDetect</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body class="login-page">
  <div class="login-card">
    <img src="{{ url_for('static', filename='logo-black.png') }}" alt="HelmDetect" />
    <h1 style="color: var(--primary-blue); font-size: 1.5rem; margin-bottom: 0.5rem">HelmDetect</h1>
    <p class="text-muted" style="margin-bottom: 2rem">Authorized Personnel Only</p>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    {% for message in messages %}
    <div
      style="background: #f8d7da; color: #721c24; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem">
      {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required />
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <div style="margin-top: 2rem; font-size: 0.85rem; color: #888">
      &copy; 2026 Kathmandu Valley Traffic Police Office
    </div>
  </div>
</body>

</html>
